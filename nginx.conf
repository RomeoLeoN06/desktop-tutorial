# ========================================================
# SARMACI FARUK - PRODUCTION NGINX CONFIGURATION TEMPLATE
# For Ubuntu / Debian / CentOS VPS or Docker Deployments
# ========================================================

server {
    listen 80;
    listen [::]:80;
    server_name sarmacifaruk.com www.sarmacifaruk.com;
    
    # Force HTTPS Redirect
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name sarmacifaruk.com www.sarmacifaruk.com;

    # Root Directory (Path to your built 'dist' folder)
    root /var/www/sarmacifaruk/dist;
    index index.html;

    # SSL Certificates (Set paths according to your Certbot/SSL certificates)
    # ssl_certificate /etc/letsencrypt/live/sarmacifaruk.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/sarmacifaruk.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Enterprise Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://maps.googleapis.com https://fonts.googleapis.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https: blob:; connect-src 'self' https: blob:; frame-src 'self' https://www.google.com https://maps.google.com; worker-src 'self' blob:; object-src 'none';" always;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # SPA Routing (Single Page Application fallback to index.html)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache Immutable Static Assets (Images, CSS, JS, Fonts)
    location ~* \.(?:css|js|woff2?|ttf|png|jpe?g|webp|svg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # Ensure index.html is never cached (Instant deployment updates)
    location = /index.html {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
    }

    # Deny Access to Hidden and Sensitive Files (.git, .env, .htaccess, etc.)
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
